services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nx_test
      POSTGRES_USER: nx
      POSTGRES_PASSWORD: nx
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nx -d nx_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
